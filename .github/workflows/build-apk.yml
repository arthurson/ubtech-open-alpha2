name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Strip comments from web assets
        run: |
          npm install terser --no-save
          node scripts/strip-web-comments.js
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/open-alpha2-beta3.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-alpha2-beta3-apk
          path: app/build/outputs/apk/debug/open-alpha2-beta3.apk
          if-no-files-found: error
