name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/offline-iflytek-test.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-iflytek-test-apk
          path: app/build/outputs/apk/debug/offline-iflytek-test.apk
          if-no-files-found: error
