name: Build APK
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 注意次序：sdkmanager 本身要 Java 17+（class file 61），必須喺 setup-java 11
      # 之前用 runner 預設 JDK 跑，否則 UnsupportedClassVersionError（只認到 55）。
      - name: Install Android SDK packages (古董 target，runner 預裝唔保證有)
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-25" "build-tools;30.0.3"
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-7.0-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-7.0-
      - name: Strip comments from web assets
        run: |
          npm install --no-save terser@5
          node scripts/strip-web-comments.js --ci
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/open-alpha2-beta5.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-alpha2-beta5-apk
          path: app/build/outputs/apk/debug/open-alpha2-beta5.apk
          if-no-files-found: error
          retention-days: 30
