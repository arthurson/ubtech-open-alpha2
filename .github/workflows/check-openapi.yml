name: check-openapi

on:
  push:
    branches: [main, master]
    paths:
      - 'openapi/**'
      - 'app/src/main/java/com/open/alpha2/MainActivity.java'
      - 'app/src/main/java/com/open/alpha2/ApiDispatcher.java'
      - 'app/src/main/java/com/open/alpha2/HttpServer.java'
      - 'app/src/main/java/com/open/alpha2/UbxApi.java'
      - 'app/src/main/java/com/open/alpha2/ChestUpgrade.java'
      - 'app/src/main/java/com/open/alpha2/AudioCenter.java'
      - 'app/src/main/java/com/open/alpha2/XiaozhiBridge.java'
      - 'app/src/main/java/com/open/alpha2/McpToolsGenerated.java'
      - 'app/src/main/java/com/open/alpha2/ApiValidator.java'
      - 'app/build.gradle'
      - 'app/src/main/assets/web/api-client.js'
      - 'scripts/**'
      - 'sdk-module/**'
      - 'app/src/main/assets/web/openapi.yml'
      - 'app/src/main/assets/web/asyncapi.yml'
      - 'app/src/main/assets/web/.well-known/**'
      - 'app/src/main/assets/web/well-known/**'
      - '.github/workflows/check-openapi.yml'
  pull_request:
    paths:
      - 'openapi/**'
      - 'app/src/main/java/com/open/alpha2/MainActivity.java'
      - 'app/src/main/java/com/open/alpha2/ApiDispatcher.java'
      - 'app/src/main/java/com/open/alpha2/HttpServer.java'
      - 'app/src/main/java/com/open/alpha2/UbxApi.java'
      - 'app/src/main/java/com/open/alpha2/ChestUpgrade.java'
      - 'app/src/main/java/com/open/alpha2/AudioCenter.java'
      - 'app/src/main/java/com/open/alpha2/XiaozhiBridge.java'
      - 'app/src/main/java/com/open/alpha2/McpToolsGenerated.java'
      - 'app/src/main/java/com/open/alpha2/ApiValidator.java'
      - 'app/build.gradle'
      - 'app/src/main/assets/web/api-client.js'
      - 'scripts/**'
      - 'sdk-module/**'
      - 'app/src/main/assets/web/openapi.yml'
      - 'app/src/main/assets/web/asyncapi.yml'
      - 'app/src/main/assets/web/.well-known/**'
      - 'app/src/main/assets/web/well-known/**'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Check openapi drift (code ↔ spec)
        run: python scripts/check-openapi-drift.py
      - name: Check api-client.js is up-to-date
        run: python scripts/generate-api-client.py --check
      - name: Check api-client routes (caller prefix matches backend)
        run: python scripts/check-api-client-routes.py
      - name: Check MCP tools are up-to-date (openapi+sync → McpToolsGenerated.java)
        run: python scripts/generate-mcp-tools.py --check
      - name: Validate openapi yaml
        run: python -c "import yaml, pathlib; yaml.safe_load(open('openapi/open-alpha2-openapi.yml', encoding='utf-8')); print('openapi.yml OK')"
      - name: Validate asyncapi yaml
        run: python -c "import yaml, pathlib; yaml.safe_load(open('openapi/asyncapi.yml', encoding='utf-8')); print('asyncapi.yml OK')"
      - name: Run ApiValidator unit tests
        run: python scripts/test-apivalidator.py
      - name: Run SerialFrameCodec unit tests
        run: python scripts/test-serialcodec.py
      - name: Check web spec copies are in sync with openapi/
        run: python scripts/check-spec-copies.py
      - name: Check version sync (build.gradle vs openapi)
        run: |
          GRADLE_VER=$(grep -oP 'versionName\s*"\K[^"]+' app/build.gradle)
          SPEC_VER=$(python -c "import yaml; print(yaml.safe_load(open('openapi/open-alpha2-openapi.yml', encoding='utf-8'))['info']['version'])")
          echo "gradle: $GRADLE_VER  spec: $SPEC_VER"
          if [ "$GRADLE_VER" != "$SPEC_VER" ]; then
            echo "::error::versionName ($GRADLE_VER) != openapi info.version ($SPEC_VER)"
            exit 1
          fi
          echo "✅ version sync $GRADLE_VER"
