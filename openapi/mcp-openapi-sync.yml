# MCP <-> OpenAPI 聲明源 (v2：自動生成用，唯一真相源之一)
# 來源：
#   - MCP tool 定義：XiaozhiBridge.java xiaozhiMcpBridge() listTools()/callTool()
#     現已改為全部自動生成：inputSchema 由 scripts/generate-mcp-tools.py
#     讀本檔 + openapi/open-alpha2-openapi.yml 生成
#     app/src/main/java/com/open/alpha2/McpToolsGenerated.java，
#     XiaozhiBridge.listTools() 只做 enable/disable 過濾，不再手寫 org.json。
#   - OpenAPI 定義：openapi/open-alpha2-openapi.yml
# 用途：確保 LLM 經 MCP 調用的參數與 HTTP 直接調用走同一套校驗 (ApiValidator.java + api-client.js)
# 再生：
#   python scripts/generate-mcp-tools.py
#   python scripts/generate-mcp-tools.py --check   # CI 用：生成結果與已提交檔比對
#
# 規則：
# - params 白名單制：只列出 MCP 對外暴露的參數；spec 有但此處無 = 刻意不暴露
#   （見各條 exclude 說明，例如 servo trim、speech engine/voice/lang）。
# - params 每條 {mcp, openapi, required, desc}：type/enum/minimum/maximum/default
#   預設自動繼承 spec 對應 openapi 參數的 schema；如需覆寫才顯式寫 type/enum/minimum/maximum/default。
# - alias：mcp 名 ≠ openapi 名時（time_ms→time、enabled→on、distance_cm→distance、
#   speed_ms→speed），生成器用 spec 的約束、MCP 的名；callTool() 側讀 MCP 名
#   （見 XiaozhiBridge callTool switch + SonarCenter mcp*()），屬薄轉調不重複校驗。
# - required 指 MCP schema 的 required（LLM 視角），可比 spec 鬆：
#   LED color/brightness 在 spec 必填，但在 MCP 為 optional（preset=stop 時免填，
#   由 callTool 內 required_if 邏輯執行，與舊手寫行為一致）。
# - mcp_only：spec 無、MCP 獨有參數（take_photo.question、image_to_text.uuid）。
# - description：LLM -facing 英文，保持舊手寫文案逐字搬入，改文案只改此檔再重 gen。
# - openapi: null：無直接 HTTP 對應（play_random_action、get_pir、get_sonar、
#   image_to_text），schema 全由本檔 mcp_only/params 描述。

sync_version: 2.0
generated_from: openapi/open-alpha2-openapi.yml
generator: scripts/generate-mcp-tools.py
output: app/src/main/java/com/open/alpha2/McpToolsGenerated.java

mappings:
  - mcp: self.robot.list_actions
    openapi: /api/action/list
    method: GET
    description: >-
      List all built-in robot actions (id, Chinese and English names). Only needed
      when unsure of the exact name - self.robot.play_action accepts names directly
      with server-side fuzzy matching.
    params: []
    exclude: [panel_token]

  - mcp: self.robot.play_action
    openapi: /api/action/play
    method: GET
    description: >-
      Play a built-in robot action by Chinese or English name (fuzzy-matched
      server-side, e.g. "跳舞" or "dance"). Call self.robot.list_actions first
      if unsure of the exact name.
    params:
      - mcp: name
        openapi: name
        required: true
        desc: 'Chinese or English action name, e.g. "舉左手" or "take left hand".'
    exclude: [panel_token]
    note: MCP 用人類可讀名 fuzzy match（resolveActionId），HTTP 用精確名

  - mcp: self.robot.stop_action
    openapi: /api/action/stop
    method: POST
    description: Stop whatever action is currently playing.
    params: []
    exclude: [panel_token]

  - mcp: self.robot.play_random_action
    openapi: null
    description: >-
      Play a random filler movement so the robot looks alive; takes no arguments.
      If this turn already plays a specific action via self.robot.play_action, skip
      this one instead of calling both.
    params: []
    note: 無直接 HTTP 對應，隨機選動作（resolveRandomActionId）

  - mcp: self.robot.servo_set_one
    openapi: /api/servo/one
    method: GET
    description: >-
      Move a single servo to an angle. Ids and valid ranges are specific to this
      robot's build - use small movements when unsure.
    params:
      - mcp: id
        openapi: id
        required: true
        desc: Servo id (1-20).
      - mcp: angle
        openapi: angle
        required: true
        desc: Target angle in degrees.
      - mcp: time_ms
        openapi: time
        required: false
        desc: Movement duration in milliseconds. Default 1000.
    exclude: [trim, panel_token]
    note: trim 刻意不暴露（經 cmd12 寫 EEPROM，MCP 不提供）；time_ms alias time

  - mcp: self.robot.servo_set_all
    openapi: /api/servo/all
    method: GET
    description: >-
      Move all 20 servos at once to a full-body pose. angles must have exactly 20
      comma-separated integers, one per servo id in order.
    params:
      - mcp: angles
        openapi: angles
        required: true
        desc: 20 comma-separated angle values, e.g. "0,0,0,...".
      - mcp: time_ms
        openapi: time
        required: false
        desc: Movement duration in milliseconds. Default 1000.
    exclude: [panel_token]

  - mcp: self.robot.led_set_head
    openapi: /api/led/head/set
    method: GET
    description: >-
      Set the head LED ring. color 1=red 2=green 3=blue 4=yellow 5=purple 6=cyan
      7=white; brightness 1-9; preset long/flash/breathe/chase/dual, or "stop"
      (off; color/brightness ignored).
    params:
      - mcp: preset
        openapi: preset
        required: false
        desc: Effect preset. Default "long".
      - mcp: color
        openapi: color
        required: false
        desc: 1-7, required unless preset=stop.
      - mcp: brightness
        openapi: brightness
        required: false
        desc: 1-9, required unless preset=stop.
    note: spec 上 color/brightness 必填，MCP 放寬為 optional（preset=stop 免填，由 callTool 執行 required_if）
    exclude: [panel_token]

  - mcp: self.robot.led_set_eye
    openapi: /api/led/eye/set
    method: GET
    description: >-
      Set the eye LED ring. Same color/brightness/preset as the head ring, except
      preset "breathe" is unavailable.
    params:
      - mcp: preset
        openapi: preset
        required: false
        desc: Effect preset. Default "long".
      - mcp: color
        openapi: color
        required: false
        desc: 1-7, required unless preset=stop.
      - mcp: brightness
        openapi: brightness
        required: false
        desc: 1-9, required unless preset=stop.
    exclude: [panel_token]

  - mcp: self.robot.led_set_mouth
    openapi: /api/led/mouth/set
    method: GET
    description: >-
      Set the mouth LED. preset "breathing" pulses at speed 0-5000ms (0=fastest);
      "off" turns it off. Driven automatically during TTS playback - manual calls
      mid-conversation may conflict.
    params:
      - mcp: preset
        openapi: preset
        required: false
        desc: Default "breathing".
      - mcp: speed_ms
        openapi: speed
        required: false
        desc: Breathing speed 0-5000ms, only used when preset=breathing. Default 0.
        minimum: 0
        maximum: 5000
    exclude: [panel_token]
    note: v1 誤寫 mcp 名 speed，實際 code/callTool 讀 speed_ms（MouthLedData.breathing），v2 以 code 為準修正

  - mcp: self.sensors.get_pir
    openapi: null
    description: >-
      Read the last known PIR motion state (most recent event, not a live poll;
      "unknown" if disabled or nothing received yet).
    params: []
    note: 對應 broadcast 查詢，無 HTTP GET，僅 WebSocket pir_state

  - mcp: self.sensors.set_pir_enabled
    openapi: /api/pir/set
    method: GET
    description: Turn the PIR motion sensor hardware on or off.
    params:
      - mcp: enabled
        openapi: "on"
        required: true
        desc: true=on, false=off.
    exclude: [panel_token]

  - mcp: self.sensors.get_sonar
    openapi: null
    description: >-
      Read the last known sonar distance in cm plus the trigger threshold (most recent
      reading, not a live poll; -1 if none yet).
    params: []
    note: 讀數經 WebSocket sonar_distance，配置經 /api/servo/sonar

  - mcp: self.sensors.set_sonar_threshold
    openapi: /api/servo/sonar
    method: GET
    description: Configure the sonar obstacle-trigger distance threshold in centimeters.
    params:
      - mcp: distance_cm
        openapi: distance
        required: true
        desc: cm.
    exclude: [panel_token]

  - mcp: self.camera.take_photo
    openapi: /api/camera/snapshot
    method: GET
    description: >-
      Take a photo and get a description of what the robot sees. Optionally pass a
      question to focus the description (e.g. "how many people are there").
    params: []
    exclude: [panel_token]
    mcp_only:
      - mcp: question
        type: string
        required: false
        desc: Optional question to focus the photo description on.
    note: question 為 MCP 獨有（vision/explain 用），HTTP snapshot 無此參數

  - mcp: self.camera.image_to_text
    openapi: null
    description: >-
      See the most recently captured photo again (from self.camera.take_photo) -
      the image is attached directly, no follow-up needed.
    params: []
    mcp_only:
      - mcp: uuid
        type: string
        required: false
        desc: Accepted but not required; the most recent photo is always returned.
    note: 兼容 shim——直接回傳最近一張相 inline，唔再影；uuid 照收但唔用（單一 device 永遠得一張最新）

  - mcp: self.robot.speak
    openapi: /api/speech/tts
    method: GET
    description: Speak a short phrase out loud through the robot's TTS.
    params:
      - mcp: text
        openapi: text
        required: true
        desc: Text to speak.
    exclude: [engine, voice, lang, panel_token]
    note: engine/voice/lang 刻意不暴露（callTool 固定 speech_startTTS en_us，與舊手寫行為一致；v1 誤寫 engine 預設 nuance 已移除）

  - mcp: self.media.list_music
    openapi: /api/audio/local_music/list
    method: GET
    description: List all local music files available to play on the robot.
    params: []
    exclude: [panel_token]

  - mcp: self.media.play_music
    openapi: /api/audio/local_music/play
    method: GET
    description: >-
      Play a local music file by song name (fuzzy-matched to filenames). Call
      self.media.list_music first if unsure what's available.
    params:
      - mcp: name
        openapi: name
        required: true
        desc: Song name or filename to play (fuzzy-matched).
    exclude: [panel_token]

  - mcp: self.media.stop_music
    openapi: /api/audio/local_music/stop
    method: GET
    description: Stop whatever local music track is currently playing.
    params: []
    exclude: [panel_token]

  - mcp: self.media.search_radio
    openapi: /api/audio/radio/search
    method: GET
    description: >-
      Search worldwide radio stations by name, city, country, broadcaster or genre.
      Returns matches - then call self.media.play_radio with one of the names
      to play it.
    params:
      - mcp: query
        openapi: query
        required: true
        desc: Search text, e.g. "BBC", "jazz", "Tokyo", "香港電台".
    exclude: [panel_token]

  - mcp: self.media.play_radio
    openapi: /api/audio/radio/play
    method: GET
    description: >-
      Play (or switch to) a radio station by name. Matches a previous
      self.media.search_radio result when possible, otherwise searches directly.
      No need to call self.media.stop_radio first.
    params:
      - mcp: name
        openapi: name
        required: true
        desc: Station name, e.g. "BBC World Service" or "香港電台第一台".
    exclude: [panel_token]

  - mcp: self.media.stop_radio
    openapi: /api/audio/radio/stop
    method: GET
    description: Stop whatever radio station is currently playing.
    params: []
    exclude: [panel_token]
