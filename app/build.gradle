plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 25

    defaultConfig {
        applicationId "com.open.alpha2"
        minSdkVersion 19
        // 2026-09: 19 ↔ 21 來回一次 —— vosk-android 要 minSdk 21，但呢個 APK
        // 要裝到 Android 4.4 (API 19) 機。解法：minSdk 維持 19（呢部機以外嘅
        // 舊機照裝得），manifest 用 tools:overrideLibrary 過 merger，
        // runtime 用 SDK_INT 熔斷（見 MainActivity voskOrError／VoskController
        // 只喺 21+ 先掂 org.vosk）。Vosk 以外嘅 code 本身全部 API 19 安全。
        targetSdkVersion 22
        versionCode 4
        versionName "beta 4"

        // 2026-08: 呢部機淨係 armeabi-v7a (RK3288, 32-bit ARM) - 其他 ABI 完全用唔
        // 到, 亦唔應該出現喺呢個專案任何一部分。opus.aar 已經喺呢個修訂移除咗,
        // 改為喺 app/src/main/cpp 用 CMake 自己編譯 libeasyopus.so, 淨係 link
        // 一份 armeabi-v7a 嘅 prebuilt libopus.so (見下面 externalNativeBuild
        // 同 app/src/main/cpp/CMakeLists.txt)。呢個 abiFilters 喺 Gradle 層面
        // 明文化呢個專案一路以嚟嘅前提; prebuilt .so (libhead_led/head_key_mgr/
        // serial_port) 一律收喺 sdk-module/hardware-direct/src/main/jniLibs，
        // 由該 module 打包進 APK（System.loadLibrary 按名解析，與放邊無關），
        // app/src/main/jniLibs 已刪除，避免兩邊重複來源撞名。
        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                // 淨係編 armeabi-v7a, 同上面 ndk.abiFilters 一致
                abiFilters 'armeabi-v7a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            // AGP 4.2.2 內建嘅 CMake 版本 (3.10.2) 已經夠用, 唔需要另外
            // 指定 version - easyopus 呢份 CMakeLists.txt 本身都寫住
            // cmake_minimum_required(VERSION 3.10.2)。
        }
    }

    // 2026-08-14 更新: 上面加 sourceSets.jniLibs 去手動打包 libopus.so 呢個
    //做法喺呢部機嘅 AGP 版本 (4.2.2) 度撞咗版 - CI build 報:
    //   "2 files found with path 'lib/armeabi-v7a/libopus.so' from inputs:
    //    - .../merged_jni_libs/debug/out   (嚟自呢度手動加嘅 jniLibs)
    //    - .../cmake/debug/obj             (CMake 自己已經攞咗)"
    // 即係話呢個 AGP 版本嘅 CMake external native build, 對
    // add_library(opus SHARED IMPORTED) 呢種 IMPORTED target, 其實已經會
    // 自動將 IMPORTED_LOCATION 指嘅 .so 一齊帶落 build output (同一開始
    // 查到嘅 android/ndk#928 舊版行為唔同, 可能後續 AGP/CMake 版本之間有
    // 修過)。手動加嘅 sourceSets.jniLibs 變咗重複來源, 導致
    // mergeDebugNativeLibs 撞名失敗。所以呢度移除返個 sourceSets block,
    // 淨係信任 CMake 自己帶嘅版本。

    signingConfigs {
        // Explicit debug keystore (see HelloAlpha's build.gradle comment upstream):
        // AGP's auto-generated ~/.android/debug.keystore path can throw on some CI/
        // headless environments, so a committed, non-secret debug key is used instead.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 2026-09: vosk-android 拖入嘅 JNA (multi-release JAR, META-INF/versions/
    // 有 Java 9+ 專用 class) 會整死舊 D8 (mergeExtDex NPE)。部機行 API 22，
    // JNA 行返 Java 8 fallback 完全夠用，直接唔打包呢啲版本類。
    packagingOptions {
        exclude 'META-INF/versions/**'
    }

    lintOptions {
        // 機械人跑 Android 5.1 (API 22)，targetSdk 22 係刻意為之（非上架 Play Store，用 adb sideload 直裝）
        // Release lint 會因 ExpiredTargetSdkVersion 報錯阻斷 assembleRelease，關掉檢查
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 2026-09: ubtechalpha2robot (Alpha2OpenSdk binder) 已刪除，脫離上游。
    implementation project(':sdk-module:hardware-direct')
    // 2026-09: Vosk 離線 ASR (語音 tab)。AAR vendor 在 app/libs (只留
    // armeabi-v7a，其他 ABI 已由 AAR 本體剃走)：vosk 本體 (libvosk.so) +
    // JNA (libjnidispatch.so)。Model 唔跟 app（~65MB 粒），放 sdcard 由
    // VoskController 掃描自動偵測。零遠程依賴，--offline 照編。
    implementation files('libs/vosk-android-0.3.75-armeabi-v7a.aar')
    implementation files('libs/jna-5.13.0-armeabi-v7a.aar')
}

// 2026-09: JNA 已隨上面 vendor 入 libs (v7a 版)，唔再經 Maven 解，force 唔再需要。
    // 2026-08: opus.aar (theeasiestway/android-opus-codec 嘅預編譯版本) 已經
    // 喺呢個修訂移除。原本嘅 aar 內含 classes.jar (Kotlin 編譯出嚟嘅
    // com.theeasiestway.opus.Opus/Constants) + libeasyopus.so + libopus.so +
    // libopusenc.so 三個 native lib。而家改為:
    //   - Java 側: app/src/main/java/com/theeasiestway/opus/{Opus,Constants}.java
    //     係純 Java 手寫版, method 簽名逐個對照原 aar 嘅 compiled bytecode
    //     (javap/constant-pool 分析) 同 easyopus.cpp 嘅 JNI export 名對齊,
    //     行為完全一致, 但冇任何 Kotlin runtime 依賴, 所以下面嘅
    //     kotlin-stdlib dependency 一齊刪走。
    //   - Native 側: app/src/main/cpp/ 用 easyopus-jni-src 源碼 (上游
    //     theeasiestway/android-opus-codec 嘅 JNI 橋接層) 經 CMake 自己編譯
    //     出 libeasyopus.so, link 一份 Arthur 提供嘅新版
    //     prebuilt/armeabi-v7a/libopus.so (opus 1.5.x 系, 帶 DRED)。冇再
    //     link opusenc, 因為 CodecOpus.cpp 完全冇用到 libopusenc 嘅任何
    //     API (見 app/src/main/cpp/CMakeLists.txt 嘅 comment)。
    // 見 app/src/main/cpp/CMakeLists.txt 同 externalNativeBuild block。
