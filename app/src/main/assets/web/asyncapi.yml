asyncapi: 2.6.0
info:
  title: Open Alpha2 WebSocket Events
  version: beta 5
  description: |
    WebSocket 即時事件總線 (RFC6455) `GET /ws`，由 `WebSocketServer.java:34` + `EventBus.java` + `RobotEventReceiver.java` 驅動。
    所有 HTTP `/api/*` 操作的非同步結果皆經此推送，無需輪詢。前端 `app-log.js` 全量訂閱。
  contact:
    name: Open Alpha2
    url: https://github.com/arthurson/ubtech-open-alpha2
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  alpha2:
    url: ws://{robotIp}:8888/ws
    protocol: websocket
    description: 機械人本機 WebSocket
    variables:
      robotIp:
        default: 192.168.43.185
        description: 機械人 IP

channels:
  /ws:
    subscribe:
      summary: 訂閱全部即時事件
      operationId: wsSubscribe
      message:
        $ref: '#/components/messages/EventEnvelope'
    publish:
      summary: 客戶端發送 (目前僅用於 ping/keepalive，業務下行由 server 推送)
      operationId: wsPublish
      message:
        $ref: '#/components/messages/ClientPing'

components:
  messages:
    EventEnvelope:
      name: EventEnvelope
      title: 通用事件外殼
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            description: 事件類型
            enum:
              # 2026-09-14 全面重新對照 EventBus.get().publish(...) 實際 call
              # site (含常量形式如 XiaozhiClient.EVT_STATE) 補齊：修正咗幾個
              # 同代碼唔對應嘅名 (bt->bt_connection, wifi->wifi_result,
              # mcp_tool_call->xiaozhi_mcp, xiaozhi_status->xiaozhi_state)，
              # 刪咗 sonar_distance (代碼冇呢個 event type, 只係 sonar payload
              # 入面一個 field key, 見下面 examples 已改用 sonar_obstacle) 同
              # xiaozhi_chat (代碼從未 publish 過，已經拆做
              # xiaozhi_llm/tts/stt/alert/custom/system 六個獨立 event，一併補
              # 齊)，加埋十幾個代碼一直有 publish 但呢度冇列嘅 event。
              - accel
              - action_stop
              - actions_pack
              - alpha2_pir_state
              - asr_partial
              - asr_result
              - authorize
              - battery
              - bt_connection
              - chest_broadcast_debug
              - chest_mute_key
              - chest_rcv
              - chest_upgrade_done
              - chest_upgrade_progress
              - gesture
              - grammar_error
              - grammar_init
              - grammar_result
              - head_key
              - head_key_native
              - head_rcv
              - mic_broadcast_debug
              - mic_state
              - offline_mode
              - qr_code
              - robot_interrupted
              - robot_uuid
              - semantic_match
              - sonar_obstacle
              - tts_end
              - vosk_download
              - vosk_state
              - volume_changed
              - wakeup
              - wifi_result
              - xiaozhi_activation
              - xiaozhi_alert
              - xiaozhi_custom
              - xiaozhi_llm
              - xiaozhi_mcp
              - xiaozhi_mic_state
              - xiaozhi_state
              - xiaozhi_stt
              - xiaozhi_system
              - xiaozhi_tts
          data:
            type: object
            description: 事件負載，依 type 而異
          ts:
            type: integer
            format: int64
            description: Unix ms
      examples:
        - name: battery
          payload:
            type: battery
            data: { level: 80, scale: 100, charging: false, status: "discharging" }
            ts: 1725710000000
        - name: sonar
          payload:
            type: sonar_obstacle
            data: { triggered: true, thresholdCm: 25 }
        - name: pir
          payload:
            type: alpha2_pir_state
            data: { triggered: true, raw: -109 }
        - name: volume
          payload:
            type: volume_changed
            data: { volume: 6, max: 15 }
    ClientPing:
      name: ClientPing
      payload:
        type: object
        properties:
          type: { type: string, enum: [ping] }
          ts: { type: integer }

  schemas:
    AsrResult:
      type: object
      properties:
        text: { type: string }
        type: { type: integer, description: "1=grammar, 0=dictation" }
