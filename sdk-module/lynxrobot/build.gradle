plugins {
    id 'com.android.library'
}

android {
    namespace 'com.ubtech.lynxrobot'
    compileSdkVersion 25

    // The AIDL interfaces in src/main/aidl are compiled to Binder stubs by AGP. Their
    // package, method names and declaration order are the wire contract with the robot's
    // on-device services and must not change.
    buildFeatures {
        aidl true
    }

    defaultConfig {
        // Upstream Alpha2OpenSdk pins minSdk 21; lowered to 19 here to support the
        // Alpha2 robot's earliest firmware (Android 4.4 / KitKat). Verified the SDK's
        // android.* usage is limited to Context/Intent/ServiceConnection/Bundle/IBinder/
        // SystemClock/Log — all present since API 1 — so this is safe.
        minSdkVersion 19
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // The reimplemented SDK depends only on the Android framework and the Java standard
    // library. The heavy third-party stack the original decompiled AAR carried (XStream,
    // HttpComponents, Jersey, JAXB, joda-time, ...) was only needed by subsystems that are
    // not part of this build, so it is intentionally absent.
}
