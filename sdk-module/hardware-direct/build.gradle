plugins {
    id 'com.android.library'
}

android {
    // AGP 4.2.2 無 namespace DSL（7.0+ 先有）；package 由 src/main/AndroidManifest.xml 提供。
    compileSdkVersion 25

    buildFeatures {
        aidl true
    }

    defaultConfig {
        minSdkVersion 19
        versionCode 1
        versionName "1.0-direct"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 2026-09: 對 ubtechalpha2robot 的依賴已移除 (module 已刪除；StaticValue/
    // DeveloperPacketData 搬入本 module)。零 project 依賴。
}
